{% extends "base.html" %}
{% block title %}注册{% endblock %}
{% block content %}
<section class="auth-card">
  <h1>注册账号</h1>
  <p class="muted">用户名 3 至 30 个字符，密码至少 8 个字符。</p>
  {% if error %}<p class="alert error">{{ error }}</p>{% endif %}
  <form method="post" class="stack-form">
    <label>用户名<input name="username" minlength="3" maxlength="30" autocomplete="username" required></label>
    <label>密码<input type="password" name="password" minlength="8" autocomplete="new-password" required></label>
    <label>确认密码<input type="password" name="password_confirm" minlength="8" autocomplete="new-password" required></label>
    <button class="button primary" type="submit">注册</button>
  </form>
  <p class="auth-switch">已有账号？<a href="/login">登录</a></p>
</section>
{% endblock %}
